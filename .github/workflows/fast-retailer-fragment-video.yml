name: Fast Retailer Fragment Video Test

on:
  push:
    branches:
      - "test/retailer-fragment-video-fast"

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install targeted dependencies
        run: pip install pytest requests beautifulsoup4 fastapi pydantic
      - name: Run retailer-fragment and HeyGen tests
        run: |
          python -m pytest backend/tests/test_product_facts.py backend/tests/test_heygen_video_api.py -q
      - name: Compile touched backend files
        run: |
          python -m py_compile backend/product_facts.py backend/heygen_video_api.py backend/photo_video_api.py
      - name: Verify exact current product reaches mocked HeyGen submit
        run: |
          python - <<'PY'
          from unittest.mock import Mock, patch
          from backend.heygen_video_api import HeyGenSubmit, heygen_submit
          from backend.photo_video_api import VideoRequest

          product_url="https://www.amazon.com/Silicone-Food-Grade-Non-Stick-Leakproof-Cooking/dp/B0HJ8LLXVL"
          product=VideoRequest(
              name="Silicone Mats for Baking Food-Grade Non-Stick Leakproof Cooking",
              image_url="https://m.media-amazon.com/images/I/61SS+778qxL._AC_SL1500_.jpg",
              product_url=product_url,
              image_source=product_url,
              product_identity_verified=True,
              seconds=15,
              style="warm",
          )
          body=HeyGenSubmit(product=product, approve_paid_generation=True)
          with patch("backend.heygen_video_api.video_guard"), \
               patch("backend.heygen_video_api.configured", return_value=True), \
               patch("backend.heygen_video_api.provider_request", return_value={"video_id":"mocked_exact_current_123"}) as send:
              result=heygen_submit(body, Mock())
          assert result["status"]=="submitted", result
          assert send.called
          print("CURRENT_PRODUCT_PREFLIGHT=PASS")
          print(send.call_args.kwargs["json"]["image"]["url"])
          PY
