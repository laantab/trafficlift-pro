name: Product URL Live Acceptance

on:
  push:
    branches:
      - "fix/product-url-live-acceptance"

jobs:
  live-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exercise deployed TrafficLift resolver with exact Amazon short link
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          import urllib.error

          product = "https://link.amazon/B03bHi8EM"
          base = "https://trafficlift-pro.onrender.com/api/v1/analyze-product-url"
          url = base + "?url=" + urllib.parse.quote(product, safe="")

          last = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=40) as r:
                      body = r.read().decode("utf-8", "replace")
                      status = r.status
              except urllib.error.HTTPError as e:
                  status = e.code
                  body = e.read().decode("utf-8", "replace")
              except Exception as e:
                  status = 0
                  body = repr(e)
              print("attempt", attempt + 1, "status", status)
              print(body[:4000])
              last = (status, body)
              if status == 200:
                  data = json.loads(body)
                  assert data.get("product_identity_verified") is True
                  assert data.get("name") or data.get("title")
                  assert data.get("image_url")
                  print("LIVE_RESOLVER_ACCEPTANCE=PASS")
                  raise SystemExit(0)
              time.sleep(5)
          raise SystemExit(f"LIVE_RESOLVER_ACCEPTANCE=FAIL last={last!r}")
          PY
