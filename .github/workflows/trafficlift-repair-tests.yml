name: TrafficLift repair tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/**"

jobs:
  hosted-owner-security-preflight:
    # Live read-only check from an external runner; no owner code, render or quota.
    # Complements offline mocks and catches accidental public status/MP4 access.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only preflight dependency
        run: pip install requests
      - name: Verify deployed owner video endpoints deny anonymous access
        run: python scripts/owner_video_live_acceptance.py --preflight

  repair-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest tree-sitter tree-sitter-javascript numpy pillow soundfile
      - name: Run Find Winner regression suite
        run: |
          mkdir -p video
          python -m pytest backend/tests/test_media_exports.py backend/tests/test_owner_video_roundtrip.py backend/tests/test_owner_video_live_acceptance.py backend/tests/test_owner_video_session.py backend/tests/test_video_readiness.py backend/tests/test_hosted_bootstrap.py backend/tests/test_hosted_runtime_packages.py backend/tests/test_hosted_voice_assets.py backend/tests/test_hosted_video_beta.py backend/tests/test_customer_homepage.py backend/tests/test_winner_history_permanent.py backend/tests/test_encoded_retailer_ids.py backend/tests/test_find_winner_repair.py backend/tests/test_discovery_redesign.py backend/tests/test_photo_video.py backend/tests/test_video_phase2_storyboard.py backend/tests/test_sales_script.py backend/tests/test_grounded_templates.py backend/tests/test_listing_photo.py -q
      - name: Check Python source compilation
        run: python -m compileall -q backend trafficlift_pro.py
      - name: Check local narrated-video user interface
        run: node backend/tests/photo_video_ui.cjs
      - name: Check protected owner acceptance MP4 browser UI
        run: node backend/tests/hosted_acceptance_ui.cjs
      - name: Check hosted owner video retry does not duplicate renders
        run: node backend/tests/hosted_owner_video_resume_ui.cjs
      - name: Install local DOM and canvas test dependencies
        run: npm install --no-save --no-package-lock jsdom@24 @napi-rs/canvas@0.1.96
      - name: Verify complete Pinterest image export in a DOM
        run: node backend/tests/full_dom_pin.cjs
      - name: Install FFmpeg and FFprobe for owner MP4 decode acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Chromium browser for release acceptance
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 jsdom@24 @napi-rs/canvas@0.1.96
          npx playwright install --with-deps chromium
      - name: Verify lamp pin in real Chromium
        run: node backend/tests/chromium_pin.cjs
      - name: Save Chromium acceptance pin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-lamp-pin
          path: /tmp/trafficlift-chromium-lamp.jpg
          if-no-files-found: ignore
      - name: Verify protected owner browser-to-MP4 acceptance with Chromium fixtures
        run: node backend/tests/owner_video_browser_acceptance_mock.cjs
      - name: Check Pinterest editorial quality safeguards
        run: node backend/tests/pinterest_editor_ui.cjs
      - name: Check persistent discovery browser history
        run: node backend/tests/discovery_history_ui.cjs
      - name: Check complete winner button workflow
        run: node backend/tests/winner_click_ui.cjs

  video-composition-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video composition dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install numpy pillow soundfile pytest
      - name: Render real Phase 2 MP4 with synthetic test speech
        run: python -m backend.tests.video_phase2_mp4_smoke
      - name: Preserve synthetic MP4 and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-smoke-mp4
          path: |
            /tmp/trafficlift-phase2-smoke.mp4
            /tmp/trafficlift-phase2-quality.json
          if-no-files-found: ignore

  real-kokoro-video-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and local voice dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install numpy pillow soundfile kokoro-onnx==0.6.1 onnxruntime==1.30.0
      - name: Download verified local Kokoro model and voice data
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request
          root=pathlib.Path('models')
          root.mkdir(exist_ok=True)
          assets=[
            ('kokoro-v1.0.int8.onnx','6e742170d309016e5891a994e1ce1559c702a2ccd0075e67ef7157974f6406cb'),
            ('voices-v1.0.bin','bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d')
          ]
          base='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/'
          for name, expected in assets:
            url=base+name
            urllib.request.urlretrieve(url,root/name)
            actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
            if actual!=expected: raise RuntimeError(f'{name}: model hash mismatch')
          PY
      - name: Render complete video with real Kokoro speech
        env:
          TRAFFICLIFT_TEST_REAL_KOKORO: "1"
          TRAFFICLIFT_VOICE_MODEL: models/kokoro-v1.0.int8.onnx
          TRAFFICLIFT_VOICES: models/voices-v1.0.bin
        run: python -m backend.tests.video_phase2_mp4_smoke
      - name: Retain narrated MP4 and quality report for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-real-kokoro-video
          path: |
            /tmp/trafficlift-phase2-real-kokoro.mp4
            /tmp/trafficlift-phase2-quality.json
          if-no-files-found: ignore
