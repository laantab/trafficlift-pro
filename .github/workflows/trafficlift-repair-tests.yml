name: TrafficLift repair tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/**"

jobs:
  hosted-owner-security-preflight:
    # Live read-only check from an external runner; no owner code, render or quota.
    # Complements offline mocks and catches accidental public status/MP4 access.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only preflight dependency
        run: pip install requests
      - name: Verify deployed owner video endpoints deny anonymous access
        run: python scripts/owner_video_live_acceptance.py --preflight

  repair-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check complete winner button and truthful card before costly setup
        run: node backend/tests/winner_click_ui.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest tree-sitter tree-sitter-javascript numpy pillow soundfile
      - name: Fast permanent winner-history regression gate
        run: python -m pytest backend/tests/test_shopify_variant_child_selectors.py backend/tests/test_shopify_collection_history.py backend/tests/test_shopify_locale_unselected_history.py backend/tests/test_ounce_winner_history.py backend/tests/test_pack_count_history.py backend/tests/test_amazon_marketplace_history.py backend/tests/test_etsy_listing_history.py backend/tests/test_unicode_winner_history.py backend/tests/test_merchant_sku_history.py -q
      - name: Verify FFmpeg and FFprobe for owner MP4 decode acceptance
        run: |
          # The Ubuntu apt mirror intermittently stalls for >120s. Use the same
          # pinned static-ffmpeg dependency already used by the hosted runtime.
          # Never skip decoding, libass subtitles or video acceptance tests.
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # The downloader prints progress to stdout. Keep only the final
            # executable directory; never put progress text into PATH.
            FFMPEG_DIR="$(python -c 'import os; from static_ffmpeg.run import get_or_fetch_platform_executables_else_raise; print(os.path.dirname(get_or_fetch_platform_executables_else_raise()[0]))' | tail -n 1)"
            test -x "$FFMPEG_DIR/ffmpeg" && test -x "$FFMPEG_DIR/ffprobe"
            export PATH="$FFMPEG_DIR:$PATH"
            echo "$FFMPEG_DIR" >> "$GITHUB_PATH"
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run Find Winner regression suite
        run: |
          mkdir -p video
          python -m pytest backend/tests/test_media_exports.py backend/tests/test_owner_existing_export_acceptance.py backend/tests/test_owner_video_roundtrip.py backend/tests/test_owner_video_live_acceptance.py backend/tests/test_owner_video_session.py backend/tests/test_video_readiness.py backend/tests/test_hosted_bootstrap.py backend/tests/test_hosted_runtime_packages.py backend/tests/test_hosted_voice_assets.py backend/tests/test_hosted_video_beta.py backend/tests/test_customer_homepage.py backend/tests/test_winner_history_permanent.py backend/tests/test_shopify_mobile_unselected_history.py backend/tests/test_shopify_variant_child_selectors.py backend/tests/test_shopify_collection_history.py backend/tests/test_shopify_locale_unselected_history.py backend/tests/test_ounce_winner_history.py backend/tests/test_pack_count_history.py backend/tests/test_attribution_tracking_history.py backend/tests/test_encoded_retailer_ids.py backend/tests/test_merchant_sku_history.py backend/tests/test_amazon_marketplace_history.py backend/tests/test_etsy_listing_history.py backend/tests/test_unicode_winner_history.py backend/tests/test_owner_discovery_history.py backend/tests/test_find_winner_repair.py backend/tests/test_discovery_redesign.py backend/tests/test_photo_video.py backend/tests/test_photo_quality.py backend/tests/test_video_phase2_storyboard.py backend/tests/test_sales_script.py backend/tests/test_video_script_upgrade.py backend/tests/test_mezmut_video_preflight.py backend/tests/test_mezmut_model_identity_20261029.py backend/tests/test_grounded_templates.py backend/tests/test_listing_photo.py -q
      - name: Check HeyGen short narration and single CTA without paid requests
        run: python -m pytest backend/tests/test_heygen_video_api.py -q
      - name: Validate exact-listing compound seller attributes before paid video
        run: python -m pytest backend/tests/test_compound_seller_facts.py -q
      - name: Verify Factory Home Screen icon and phone install routes
        run: python -m pytest backend/tests/test_mobile_shortcut_icon.py -q
      - name: Check Python source compilation
        run: python -m compileall -q backend trafficlift_pro.py
      - name: Check local narrated-video user interface
        run: node backend/tests/photo_video_ui.cjs
      - name: Check protected owner acceptance MP4 browser UI
        run: node backend/tests/hosted_acceptance_ui.cjs
      - name: Verify HeyGen owner-modal same-origin connection check
        run: node backend/tests/heygen_verify_ui.cjs
      - name: Verify HeyGen engine selection and paid consent
        run: node backend/tests/heygen_video_ui.cjs
      - name: Check hosted owner video retry does not duplicate renders
        run: node backend/tests/hosted_owner_video_resume_ui.cjs
      - name: Install local DOM and canvas test dependencies
        run: npm install --no-save --no-package-lock jsdom@24 @napi-rs/canvas@0.1.96
      - name: Verify complete Pinterest image export in a DOM
        run: node backend/tests/full_dom_pin.cjs
      - name: Install Chromium browser for release acceptance
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 jsdom@24 @napi-rs/canvas@0.1.96
          npx playwright install --with-deps chromium
      - name: Verify mobile dashboard and Video Studio preserve desktop design
        run: node backend/tests/mobile_responsive_chromium.cjs
      - name: Verify lamp pin in real Chromium
        run: node backend/tests/chromium_pin.cjs
      - name: Verify pin retry, 502 and real JPEG download without rediscovery
        run: node backend/tests/pin_retry_chromium.cjs
      - name: Verify bounded safe public pin-photo endpoint
        run: python -m pytest backend/tests/test_pin_image_api.py -q
      - name: Save Chromium acceptance pin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-lamp-pin
          path: /tmp/trafficlift-chromium-lamp.jpg
          if-no-files-found: ignore
      - name: Verify protected owner browser-to-MP4 acceptance with Chromium fixtures
        run: node backend/tests/owner_video_browser_acceptance_mock.cjs
      - name: Check Pinterest editorial quality safeguards
        run: node backend/tests/pinterest_editor_ui.cjs
      - name: Check persistent discovery browser history
        run: node backend/tests/discovery_history_ui.cjs

  video-composition-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video composition dependencies
        run: |
          # Hosted Ubuntu runners normally have FFmpeg and DejaVu already.
          # Skip apt network refresh when both are present; a slow mirror
          # must not stall the release smoke gate before any MP4 is tested.
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            pip install static-ffmpeg==3.0
            # The downloader prints progress to stdout. Keep only the final
            # executable directory; never put progress text into PATH.
            FFMPEG_DIR="$(python -c 'import os; from static_ffmpeg.run import get_or_fetch_platform_executables_else_raise; print(os.path.dirname(get_or_fetch_platform_executables_else_raise()[0]))' | tail -n 1)"
            test -x "$FFMPEG_DIR/ffmpeg" && test -x "$FFMPEG_DIR/ffprobe"
            export PATH="$FFMPEG_DIR:$PATH"
            echo "$FFMPEG_DIR" >> "$GITHUB_PATH"
          fi
          # A missing font is a hard failure, not permission to skip captions.
          # Ubuntu runners normally provide DejaVu; install only this small font
          # package if the runner image is unusually minimal.
          if ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 update
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -y install fonts-dejavu-core
          fi
          command -v ffmpeg
          command -v ffprobe
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          pip install numpy pillow soundfile pytest beautifulsoup4
      - name: Render real Phase 2 MP4 with synthetic test speech
        run: python -m backend.tests.video_phase2_mp4_smoke
      - name: Preserve synthetic MP4 and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-smoke-mp4
          path: |
            /tmp/trafficlift-phase2-smoke.mp4
            /tmp/trafficlift-phase2-smoke-frames.jpg
            /tmp/trafficlift-phase2-quality.json
          if-no-files-found: ignore

  real-kokoro-video-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and local voice dependencies
        run: |
          # Ubuntu runners generally include FFmpeg and DejaVu. Do not block
          # narrated-video acceptance on a redundant apt mirror refresh.
          # If either prerequisite is absent, install it rather than skip QA.
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            pip install static-ffmpeg==3.0
            # The downloader prints progress to stdout. Keep only the final
            # executable directory; never put progress text into PATH.
            FFMPEG_DIR="$(python -c 'import os; from static_ffmpeg.run import get_or_fetch_platform_executables_else_raise; print(os.path.dirname(get_or_fetch_platform_executables_else_raise()[0]))' | tail -n 1)"
            test -x "$FFMPEG_DIR/ffmpeg" && test -x "$FFMPEG_DIR/ffprobe"
            export PATH="$FFMPEG_DIR:$PATH"
            echo "$FFMPEG_DIR" >> "$GITHUB_PATH"
          fi
          # A missing font is a hard failure, not permission to skip captions.
          # Ubuntu runners normally provide DejaVu; install only this small font
          # package if the runner image is unusually minimal.
          if ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 update
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -y install fonts-dejavu-core
          fi
          command -v ffmpeg
          command -v ffprobe
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          pip install numpy pillow soundfile beautifulsoup4 kokoro-onnx==0.6.1 onnxruntime==1.30.0
      - name: Download verified local Kokoro model and voice data
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request
          root=pathlib.Path('models')
          root.mkdir(exist_ok=True)
          assets=[
            ('kokoro-v1.0.int8.onnx','6e742170d309016e5891a994e1ce1559c702a2ccd0075e67ef7157974f6406cb'),
            ('voices-v1.0.bin','bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d')
          ]
          base='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/'
          for name, expected in assets:
            url=base+name
            urllib.request.urlretrieve(url,root/name)
            actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
            if actual!=expected: raise RuntimeError(f'{name}: model hash mismatch')
          PY
      - name: Render complete video with real Kokoro speech
        env:
          TRAFFICLIFT_TEST_REAL_KOKORO: "1"
          TRAFFICLIFT_VOICE_MODEL: models/kokoro-v1.0.int8.onnx
          TRAFFICLIFT_VOICES: models/voices-v1.0.bin
        run: python -m backend.tests.video_phase2_mp4_smoke
      - name: Run one owned-fixture Pinterest to narrated-video export acceptance
        run: |
          # The owned drawing is the same Desk Organizer fixture used by the
          # real Kokoro compositor. No seller photo, owner secret or paid call.
          npm install --no-save --no-package-lock playwright@1.56.1 @napi-rs/canvas@0.1.96
          npx playwright install --with-deps chromium
          node backend/tests/integrated_owned_pin.cjs
          node backend/tests/hosted_owner_browser_recovery.cjs
          pip install fastapi==0.115.6 pydantic==2.10.4 httpx==0.28.1 requests==2.32.3
          TRAFFICLIFT_TEST_REAL_KOKORO=1 python -m backend.tests.integrated_release_acceptance
      - name: Retain narrated MP4 and quality report for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-real-kokoro-video
          path: |
            /tmp/trafficlift-phase2-real-kokoro.mp4
            /tmp/trafficlift-phase2-real-kokoro-frames.jpg
            /tmp/trafficlift-phase2-quality.json
            /tmp/trafficlift-integrated-pin.jpg
            /tmp/trafficlift-integrated-pin-evidence.json
            /tmp/trafficlift-integrated-acceptance.json
            /tmp/trafficlift-integrated-tiktok.zip
            /tmp/trafficlift-integrated-youtube-shorts.zip
            /tmp/trafficlift-integrated-instagram-reels.zip
          if-no-files-found: ignore
