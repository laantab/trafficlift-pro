name: TrafficLift repair tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/**"

jobs:
  repair-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest tree-sitter tree-sitter-javascript
      - name: Run Find Winner regression suite
        run: |
          mkdir -p video
          python -m pytest backend/tests/test_find_winner_repair.py backend/tests/test_discovery_redesign.py -q
      - name: Check persistent discovery browser history
        run: node backend/tests/discovery_history_ui.cjs
