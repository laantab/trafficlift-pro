<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner Studio · TrafficLift Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ec;color:#1c302c;font:17px/1.55 system-ui,sans-serif}main{max-width:680px;margin:auto;padding:24px}header{border-bottom:1px solid #bac4bc;padding-bottom:14px}h1{font:42px Georgia,serif;margin:24px 0}label{display:block;margin:12px 0}input,select,button,.download{font:inherit;padding:10px;border:1px solid #91a69b;border-radius:8px}input:not([type=checkbox]),select{width:100%;background:white}button,.download{background:#14513f;color:white;cursor:pointer}button:disabled{opacity:.6}a{color:#14513f}video{width:100%;max-height:58vh;background:#182625}details{margin:22px 0}summary{cursor:pointer}.download{display:inline-block;text-decoration:none}[hidden]{display:none!important}
</style><main><header><a href="/">TrafficLift Pro</a> · <a href="/analytics">Ad Analytics</a> · <a href="/growth">TikTok 30-Day Plan</a></header><h1>Owner Studio</h1>
<form id="unlock" hidden><label>Owner access code<input id="code" type="password" autocomplete="current-password" required></label><label><input type="checkbox" id="remember" checked> Remember this personal device for 90 days</label><button>Enter Owner Studio</button></form>
<section id="studio" hidden><label>Saved product<select id="products"></select></label><button id="create">Create Campaign</button>
<details><summary>Save another product</summary><form id="save">
<label>Product name<input name="name" required maxlength="80"></label><label>Purchase link<input name="destination" type="url" required></label>
<label>One verified feature<input name="feature" required minlength="3" maxlength="120"></label><label>Page quotation or demonstration detail<input name="prompt" maxlength="100"></label>
<label>Cover or verified product photo<input id="cover" type="file" accept="image/*" required></label>
<label>Book interior PDF (automatically selects two pages)<input id="pdf" type="file" accept="application/pdf"></label>
<label>Inside page or detail photo<input id="inside" type="file" accept="image/*"></label><label>Second page or detail photo<input id="second" type="file" accept="image/*"></label>
<label><input name="affiliate" type="checkbox"> This is an affiliate link</label><button>Save product</button></form></details><button id="forget" type="button">Sign out and forget this device</button></section>
<p id="message" role="status"></p><section id="review" hidden><h2>Review your campaign</h2><video controls playsinline id="player"></video><details id="shorts" hidden><summary>YouTube Shorts posting details</summary><p><strong id="shortTitle"></strong></p><p id="shortCover"></p><p id="shortHook"></p><p id="shortDescription" style="white-space:pre-line"></p></details><p><button id="approve">Approve and get posting kit</button> <a id="kit" class="download" hidden>Download posting kit</a></p><details id="pinPanel"><summary>Schedule a Pinterest video Pin</summary>
<label>Board<select id="pinBoard"></select></label><label>Posting time on this device<input type="datetime-local" id="pinTime"></label>
<button type="button" id="pinSchedule" disabled>Approve and schedule Pin</button>
<button type="button" id="pinRefresh">Refresh Pinterest status</button><p id="pinStatus" role="status"></p><ul id="pinHistory"></ul></details>
<p><button id="another" type="button">Create another ad</button></p><a href="/">Back to TrafficLift</a></section></main>
<script>
const el=id=>document.getElementById(id);
async function api(path,options={}) {
 const response=await fetch(path,{cache:'no-store',...options});
 const data=await response.json();
 if(response.status===401){el('unlock').hidden=false;el('studio').hidden=true}
 if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'Please check the product details.');
 return data;
}
const post=(path,data)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
async function refresh(){const products=await api('/api/v1/campaign-products');el('products').replaceChildren(...products.map(p=>new Option(p.name,p.id)));el('studio').hidden=false;el('unlock').hidden=true}
function report(error){el('message').textContent=error.message;el('message').scrollIntoView({block:'nearest'})}
async function watch(id){
 el('create').disabled=true;el('review').hidden=true;
 try{
 for(;;){let job=await api('/api/v1/ad-campaigns/'+id);
 if(job.status==='ready'){
   const short=job.shorts;
   el('shorts').hidden=!short;
   if(short){
     el('shortTitle').textContent=short.title;
     el('shortCover').textContent='Opening frame: '+short.cover_text;
     el('shortHook').textContent='Spoken hook: '+short.hook;
     el('shortDescription').textContent=short.description;
   }
   break;
 }
 if(job.status==='held'){localStorage.removeItem('campaign-pending');localStorage.removeItem('campaign-last');throw Error('This video needs a fresh editorial review. Create a new campaign to continue.')}
 if(job.status==='failed'){localStorage.removeItem('campaign-pending');throw Error('Rendering stopped. Create Campaign will retry the opening.')}
 el('message').textContent='Creating the narration, video, cover frame and posting drafts…';
 await new Promise(resolve=>setTimeout(resolve,2500))}
 el('pinPanel').open=false;el('pinPanel').dataset.id=id;
 const path='/api/v1/ad-campaigns/'+id;el('player').src=path+'/video';el('kit').href=path+'/kit';el('kit').hidden=true;el('approve').hidden=false;el('review').hidden=false;el('message').textContent='Play the video and review the narration.';localStorage.setItem('campaign-last',id);localStorage.removeItem('campaign-pending')
 }finally{el('create').disabled=false}
}
function showPins(rows){
 el('pinHistory').replaceChildren(...rows.map(row=>{
   const li=document.createElement('li');
   li.textContent=new Date(row.due*1000).toLocaleString()+' · '+row.state+' ';
   if(row.pin){const link=document.createElement('a');link.href='https://www.pinterest.com/pin/'+row.pin+'/';link.textContent='View Pin';li.append(link)}
   return li;
 }));
}
async function loadPins(){
 const id=el('pinPanel').dataset.id;
 el('pinSchedule').disabled=true;el('pinStatus').textContent='Checking Pinterest…';
 try{
   const rows=await api('/api/v1/pinterest/'+id);
   if(el('pinPanel').dataset.id!==id)return;
   showPins(rows);
   const boards=await api('/api/v1/pinterest/boards');
   if(el('pinPanel').dataset.id!==id)return;
   el('pinBoard').replaceChildren(...boards.map(b=>new Option(b.name,b.id)));
   el('pinSchedule').disabled=!boards.length;
   el('pinStatus').textContent=boards.length?'Choose a board and time after reviewing the video.':'Create a Pinterest board before scheduling.';
 }catch(e){el('pinStatus').textContent=e.message}
}
el('pinPanel').ontoggle=()=>{if(el('pinPanel').open)loadPins()};
el('pinRefresh').onclick=loadPins;
el('pinSchedule').onclick=async()=>{
 const when=new Date(el('pinTime').value);
 if(!(when>Date.now())){el('pinStatus').textContent='Choose a future time.';return}
 el('pinSchedule').disabled=true;
 try{showPins(await post('/api/v1/pinterest/'+el('pinPanel').dataset.id,{board:el('pinBoard').value,when:when.toISOString()}));el('pinStatus').textContent='See the saved posting time and status below.'}
 catch(e){el('pinStatus').textContent=e.message}finally{el('pinSchedule').disabled=false}
};
el('approve').onclick=()=>{el('kit').hidden=false;el('approve').hidden=true;el('kit').click()};
function newAd(){
 el('player').pause();
 el('review').hidden=true;
 el('message').textContent='Choose a saved product, then select Create Campaign.';
 el('products').focus({preventScroll:true});
 el('studio').scrollIntoView({block:'start'});
}
el('another').onclick=newAd;
async function start(){
 await refresh();
 const pending=localStorage.getItem('campaign-pending');
 if(pending)return watch(pending);
 if(new URLSearchParams(location.search).get('new')==='1')return newAd();
 const last=localStorage.getItem('campaign-last');
 if(last)await watch(last)
}
el('unlock').onsubmit=async e=>{e.preventDefault();try{await post('/api/v1/video-owner-login',{access_code:el('code').value,remember_device:el('remember').checked});el('code').value='';await start()}catch(error){report(error)}};
el('create').onclick=async()=>{el('create').disabled=true;try{const id=crypto.randomUUID();const job=await post('/api/v1/ad-campaigns',{product:el('products').value,request_id:id});localStorage.setItem('campaign-pending',job.id);await watch(job.id);el('review').scrollIntoView({block:'start'})}catch(error){report(error)}finally{el('create').disabled=false}};
async function imageData(file){const bitmap=await createImageBitmap(file);const scale=Math.min(1,1400/Math.max(bitmap.width,bitmap.height));const c=document.createElement('canvas');c.width=Math.round(bitmap.width*scale);c.height=Math.round(bitmap.height*scale);c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);bitmap.close();return c.toDataURL('image/jpeg',.85).split(',')[1]}
el('save').onsubmit=async e=>{e.preventDefault();const form=e.target;const button=form.querySelector('button');button.disabled=true;try{const data=Object.fromEntries(new FormData(form));data.affiliate=form.elements.affiliate.checked;data.images=[];for(const id of ['cover','inside','second']){const file=el(id).files[0];if(file)data.images.push(await imageData(file))}const pdf=el('pdf').files[0];if(pdf){if(pdf.size>37000000)throw Error('Use an interior PDF under 37 MB.');data.interior_pdf=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(pdf)})}const saved=await post('/api/v1/campaign-products',data);await refresh();el('products').value=saved.id;form.reset();form.closest('details').open=false;el('message').textContent='Saved. Your product is ready for a campaign.'}catch(error){report(error)}finally{button.disabled=false}};
async function enter(){
 // Renew the short owner session at entry, even when a previous one still works.
 const response=await fetch('/api/v1/owner-device/enter',{method:'POST',credentials:'same-origin',cache:'no-store'});
 if(!response.ok && response.status!==401)throw Error('Owner access is temporarily unavailable.');
 await start()
}
el('forget').onclick=async()=>{try{await post('/api/v1/owner-device/forget',{});localStorage.removeItem('campaign-pending');localStorage.removeItem('campaign-last');location.replace('/owner')}catch(error){report(error)}};
enter().catch(report);
</script></html>
